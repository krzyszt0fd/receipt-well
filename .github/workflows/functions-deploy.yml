name: Deploy Functions

on:
  push:
    branches: [develop]
    paths:
      - 'src/backend/ReceiptWell.Functions/**'
      - 'src/backend/ReceiptWell.Core/**'
      - '.github/workflows/functions-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore src/backend/ReceiptWell.Functions/ReceiptWell.Functions.csproj

      - name: Build & Publish
        run: dotnet publish src/backend/ReceiptWell.Functions/ReceiptWell.Functions.csproj -c Release -o ./publish --no-restore

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: ./publish
