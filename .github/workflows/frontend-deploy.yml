name: Deploy Frontend

on:
  push:
    branches: [develop]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Lint
        run: npm run lint
        working-directory: src/frontend

      - name: Test
        run: npm test
        working-directory: src/frontend

      - name: Substitute environment placeholders
        run: |
          sed -i "s|__API_URL__|${{ vars.BACKEND_API_URL }}|g" src/frontend/src/environments/environment.prod.ts
          sed -i "s|__AUTHORITY__|${{ vars.AUTHORITY }}|g" src/frontend/src/environments/environment.prod.ts
          sed -i "s|__KNOWN_AUTHORITY__|${{ vars.KNOWN_AUTHORITY }}|g" src/frontend/src/environments/environment.prod.ts
          sed -i "s|__CLIENT_ID__|${{ vars.MSAL_CLIENT_ID }}|g" src/frontend/src/environments/environment.prod.ts
          sed -i "s|__API_SCOPE__|${{ vars.API_SCOPE }}|g" src/frontend/src/environments/environment.prod.ts

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /src/frontend
          output_location: dist/frontend/browser
          api_location: ""
