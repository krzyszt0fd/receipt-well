name: E2E Tests
on:
  push:
    branches: [ develop ]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      AUTHORITY: ${{ secrets.E2E_AUTHORITY }}
      TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install frontend dependencies
      run: npm ci
      working-directory: src/frontend

    - name: Substitute environment placeholders
      run: |
        sed -i "s|__AUTHORITY__|${{ vars.AUTHORITY }}|g" src/frontend/src/environments/environment.ci.ts
        sed -i "s|__KNOWN_AUTHORITY__|${{ vars.KNOWN_AUTHORITY }}|g" src/frontend/src/environments/environment.ci.ts
        sed -i "s|__CLIENT_ID__|${{ vars.MSAL_CLIENT_ID }}|g" src/frontend/src/environments/environment.ci.ts
        sed -i "s|__API_SCOPE__|${{ vars.API_SCOPE }}|g" src/frontend/src/environments/environment.ci.ts

    - name: Install E2E dependencies
      run: npm ci
      working-directory: src/e2e-tests

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: src/e2e-tests

    - name: Run Playwright tests
      run: npx playwright test
      working-directory: src/e2e-tests

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: src/e2e-tests/playwright-report/
        retention-days: 30
