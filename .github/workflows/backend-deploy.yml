name: Deploy Backend

on:
  push:
    branches: [develop]
    paths:
      - 'src/backend/**'
      - '!src/backend/ReceiptWell.Functions/**'
      - '.github/workflows/backend-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore src/backend/ReceiptWell.Web/ReceiptWell.Web.csproj

      - name: Build & Publish
        run: dotnet publish src/backend/ReceiptWell.Web/ReceiptWell.Web.csproj -c Release -o ./publish --no-restore

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: receipt-well-api
          resource-group-name: receipt-well-rg
          package: ./publish

      - name: Smoke test
        run: |
          sleep 30
          curl --fail https://receipt-well-api.azurewebsites.net/health
