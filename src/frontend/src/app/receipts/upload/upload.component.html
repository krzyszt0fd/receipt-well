<div class="upload-page">
  <mat-card class="upload-card">
    <mat-card-header>
      <mat-card-title>Upload Receipt</mat-card-title>
      <mat-card-subtitle>PNG · JPEG · WEBP · GIF &nbsp;·&nbsp; Max 20 MB</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="file-zone" [class.file-zone--selected]="selectedFile()">
        <label for="file-input" class="file-zone__label">
          <mat-icon class="file-zone__icon" aria-hidden="true">upload_file</mat-icon>
          <span class="file-zone__text">
            @if (selectedFile(); as f) {
              {{ f.name }}
            } @else {
              Tap to select a receipt photo
            }
          </span>
          <input
            id="file-input"
            type="file"
            class="file-zone__input"
            accept=".png,.jpg,.jpeg,.webp,.gif"
            capture="environment"
            [disabled]="state() === 'uploading'"
            (change)="onFileSelected($event)"
          />
        </label>
      </div>

      @if (validationError()) {
        <span role="alert" class="validation-error">
          <mat-icon aria-hidden="true">error_outline</mat-icon>
          {{ validationError() }}
        </span>
      }
    </mat-card-content>

    <mat-card-actions align="end">
      @if (state() === 'uploading') {
        <span class="uploading-row">
          <mat-spinner diameter="24" />
          <span>Uploading…</span>
        </span>
      } @else {
        <button
          mat-raised-button
          color="primary"
          type="button"
          [disabled]="!selectedFile()"
          (click)="submit()"
        >
          Upload
        </button>
      }
    </mat-card-actions>
  </mat-card>
</div>
